name: NVIDIAI Launch CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run compile
      - run: npm run validate
      - run: npm test
      - run: npm run preflight
      - name: Build backup bundle
        if: always()
        run: |
          mkdir -p launch-backup
          cp package.json launch-backup/
          cp hardhat.config.ts launch-backup/
          cp -R contracts launch-backup/
          cp -R scripts launch-backup/
          cp -R test launch-backup/
          cp -R artifacts launch-backup/ 2>/dev/null || true
          cp -R cache launch-backup/ 2>/dev/null || true
          git rev-parse HEAD > launch-backup/COMMIT_SHA.txt
      - name: Store CI backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidiai-launch-backup-${{ github.sha }}
          path: launch-backup/
          retention-days: 90
